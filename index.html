<!DOCTYPE html>
<html>

<head>
  <title>Website Title</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>

<body>
  <div class="switchesBox">
    <div class="row fast">
      <label>FAST</label>
      <div class="switch">
        <input type="checkbox" id="fast">
        <div class="switchThumb"></div>
      </div>
    </div>
    <div class="row cheap">
      <label>CHEAP</label>
      <div class="switch">
        <input type="checkbox" id="cheap">
        <div class="switchThumb"></div>
      </div>
    </div>
    <div class="row good">
      <label>GOOD</label>
      <div class="switch">
        <input type="checkbox" id="good">
        <div class="switchThumb"></div>
      </div>
    </div>
  </div>
</body>

</html>
